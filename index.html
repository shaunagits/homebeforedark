/* ---------- sizing ---------- */

  else{W=176;H=Math.min(330,Math.round(176/a));}
  cv.width=W;cv.height=H;
  const sc=Math.min(vw/W,vh/H);
  cv.style.width=Math.floor(W*sc)+'px';cv.style.height=Math.floor(H*sc)+'px';
  HZ=Math.round(H*0.36);YR=H-20;K=YR-HZ;CX=W>>1;
  img=ctx.createImageData(W,H);buf=new Uint32Array(img.data.buffer);
  ctx.imageSmoothingEnabled=false;
  let s=7;const rnd=()=>(s=(s*16807)%2147483647)/2147483647;
  makeTreeline();
  stars=[];for(let i=0;i<28;i++)stars.push([Math.floor(rnd()*W),Math.floor(rnd()*(HZ-6)),0.2+rnd()*0.5]);
}

}
const RP={h:'#3a2416',s:'#e0a47a',R:'#cf2a1f',r:'#8a1610',P:'#bb8a52',p:'#7a4a22',d:'#3e2410',H:'#e6493a',j:'#34508a',b:'#5a4030',k:'#3c3c48',g:'#9a9aa6',w:'#e8e8e8',o:'#ff5020'};

const plaid=rows=>rows.map((r,j)=>r.replace(/[Pp]/g,(ch,i)=>{const v=i%2===0,h=j%3===0;return v&&h?'d':(v||h?'p':'P');}));
const BODYP=plaid(BODY);

const BOYTOP=BODYP.slice(0,17).map(r=>r.replace(/g/g,'.'));
const boyA=spr(BOYTOP.concat(["......jjjjjjjj......","......jjj..jjj......","......jjj..jjj......","......jj....jj......","......ww....ww......"]),RP),boyB=spr(BOYTOP.concat(["......jjjjjjjj......","......jjj..jjj......","......jj...jjj......","......jj...jj.......",".......ww..ww......."]),RP),BH=22;
const pack=spr([".bbbbb.","bBBBBBb","bBbbbBb","bBBBBBb","bBBkBBb","bBBBBBb",".bbbbb."],{b:'#22345c',B:'#34508a',k:'#c98a3a'});

const MON=HEAD_OPEN.concat(MBODY),monSpr=spr(MON,MP),monShut=spr(HEAD_SHUT.concat(MBODY),MP),monEyes=spr(MON,MP,'t'),MW=24,MH=MON.length,MSC=1.5;

const MREACH=(()=>{
  const g=MON.map(r=>r.split(''));
  for(let j=13;j<32;j++)for(let i=0;i<24;i++)if((i<6||i>17)&&(j>=15||i<3||i>20||(j===13&&(i<4||i>19))))g[j][i]='.';
  const set=(i,j,ch)=>{g[j][i]=ch;g[j][23-i]=ch;};
  for(let j=1;j<=3;j++){set(0,j,'c');set(2,j,'c');}
  set(1,3,'m');set(3,3,'m');
  for(let j=4;j<=9;j++){set(1,j,'m');set(2,j,'m');}
  for(let j=10;j<=12;j++){set(2,j,'m');set(3,j,'m');}
  set(3,13,'m');set(4,13,'m');

const monGlow=spr(MON,MP,'t'),monReach=spr(MREACH,MP),monReachGlow=spr(MREACH,MP,'t');
const fallen=(()=>{
  const c=document.createElement('canvas');c.width=30;c.height=12;const x=c.getContext('2d');
  const px=(i,j,col)=>{x.fillStyle=col;x.fillRect(i,j,1,1);};
  const ring=(cx,cy,rx,ry,col)=>{for(let a=0;a<64;a++){const th=a/64*Math.PI*2;px(Math.round(cx+Math.cos(th)*rx),Math.round(cy+Math.sin(th)*ry),col);}};
  const line=(x0,y0,x1,y1,col)=>{const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0));for(let i=0;i<=n;i++)px(Math.round(x0+(x1-x0)*i/n),Math.round(y0+(y1-y0)*i/n),col);};
  ring(6,7,6,4,'#3c3c48');ring(23,7,6,4,'#3c3c48');
  const f='#9a9aa6';
  line(6,7,13,4,f);line(13,4,21,3,f);line(21,3,23,7,f);line(13,4,14,8,f);line(14,8,6,7,f);line(14,8,21,3,f);
  line(20,1,24,1,f);line(22,1,21,3,f);line(11,3,14,3,'#5a4030');px(1,7,'#ff5020');
  return c;
})();

/* ---------- tiny pixel font ---------- */
const FONT={A:'010101111101101',B:'110101110101110',C:'011100100100011',D:'110101101101110',E:'111100110100111',F:'111100110100100',G:'011100101101011',H:'101101111101101',I:'111010010010111',J:'001001001101010',K:'101101110101101',L:'100100100100111',M:'1000111011101011000110001',N:'10011101101110011001',O:'010101101101010',P:'110101110100100',Q:'010101101110011',R:'110101110101101',S:'011100010001110',T:'111010010010010',U:'101101101101111',V:'101101101101010',W:'1000110001101011101110001',X:'101101010101101',Y:'101101010010010',Z:'111001010100111',
0:'111101101101111',1:'010110010010111',2:'110001010100111',3:'110001010001110',4:'101101111001001',5:'111100110001110',6:'011100111101111',7:'111001010010010',8:'111101111101111',9:'111101111001110','.':'000000000000010',':':'000010000010000','-':'000000111000000','/':'001001010100100'};
function text(s,x,y,sc,col,al){
  ctx.globalAlpha=al==null?1:al;ctx.fillStyle=col;
  for(const ch of s){const g=FONT[ch],w=g?g.length/5:3;if(g)for(let i=0;i<g.length;i++)if(g[i]==='1')ctx.fillRect(x+(i%w)*sc,y+((i/w)|0)*sc,sc,sc);x+=(w+1)*sc;}
  ctx.globalAlpha=1;
}
function ctext(s,y,sc,col,al){let n=-1;for(const ch of s)n+=(FONT[ch]?FONT[ch].length/5:3)+1;text(s,Math.round(CX-n*sc/2),y,sc,col,al);}

/* ---------- sound ---------- */
const MUSIC_FILE='music.mp3';   // drop a file with this name next to index.html and it loops in the background
const SFX_VOLUME=0, MUSIC_VOLUME=0.5;   // sound effects are off for now (music only); set SFX_VOLUME to 1 to bring back the wheel whir, streetlight hum and event sounds
let sfxG=null,musicG=null,synthTimer=null,seqT=0,seqStep=0,arpF=null;
let ac=null,master=null,muted=false,noiseBuf=null,whirG=null,whirF=null,buzzG=null,music=null,clickT=0;
try{muted=localStorage.getItem('homebeforedark-muted')==='1';}catch(e){}
function audio(){
  if(!ac){try{
    ac=new (window.AudioContext||window.webkitAudioContext)();
    master=ac.createGain();master.gain.value=muted?0:1;master.connect(ac.destination);
    sfxG=ac.createGain();sfxG.gain.value=SFX_VOLUME;sfxG.connect(master);
    musicG=ac.createGain();musicG.gain.value=MUSIC_VOLUME;musicG.connect(master);
    noiseBuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const n=ac.createBufferSource();n.buffer=noiseBuf;n.loop=true;
    whirF=ac.createBiquadFilter();whirF.type='bandpass';whirF.frequency.value=400;whirF.Q.value=1.2;
    whirG=ac.createGain();whirG.gain.value=0;n.connect(whirF);whirF.connect(whirG);whirG.connect(sfxG);n.start();
    const o=ac.createOscillator();o.type='sawtooth';o.frequency.value=118;
    const o2=ac.createOscillator();o2.type='square';o2.frequency.value=59;
    const bf=ac.createBiquadFilter();bf.type='highpass';bf.frequency.value=900;
    buzzG=ac.createGain();buzzG.gain.value=0;o.connect(bf);o2.connect(bf);bf.connect(buzzG);buzzG.connect(sfxG);o.start();o2.start();
  }catch(e){ac=null;}}
  if(ac&&ac.state==='suspended')ac.resume().catch(()=>{});
  if(music===null){try{music=new Audio(MUSIC_FILE);music.loop=true;music.volume=0.45;music.muted=muted;music.addEventListener('error',()=>{music=false;});music.addEventListener('playing',stopSynth);}catch(e){music=false;}}
  if(music&&music.paused)music.play().catch(()=>{});
  startSynth();
}
/* built-in synth loop (original). It steps aside automatically if a music.mp3 file is present. */
const BPM=96,STEP=60/BPM/4,ARP=[0,12,7,12,15,12,7,12,0,12,7,12,19,15,12,7];
const PROG=[[40,15],[36,16],[33,15],[35,16]];   // bar root note, and whether its third is minor (15) or major (16)
const mhz=m=>440*Math.pow(2,(m-69)/12);
function startSynth(){
  if(!ac||synthTimer||music&&!music.paused&&music.currentTime>0)return;
  if(!arpF){
    arpF=ac.createBiquadFilter();arpF.type='lowpass';arpF.Q.value=6;arpF.frequency.value=900;
    const dl=ac.createDelay(1),fb=ac.createGain(),wet=ac.createGain();dl.delayTime.value=STEP*3;fb.gain.value=0.35;wet.gain.value=0.4;
    arpF.connect(musicG);arpF.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(musicG);
  }
  seqT=ac.currentTime+0.08;
  synthTimer=setInterval(()=>{
    if(!ac||ac.state!=='running')return;
    if(seqT<ac.currentTime)seqT=ac.currentTime+0.05;
    while(seqT<ac.currentTime+0.25){
      const bar=Math.floor(seqStep/16)%4,i=seqStep%16,root=PROG[bar][0];let off=ARP[i];if(off===15)off=PROG[bar][1];
      const t=seqT;
      try{
        const o=ac.createOscillator(),g=ac.createGain();o.type='sawtooth';o.frequency.value=mhz(root+12+off);
        g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.09,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+STEP*1.9);
        arpF.frequency.setValueAtTime((800+500*Math.sin(seqStep/64*Math.PI*2))*(warn[0]||warn[1]?0.55:1),t);   // a little muffled while a light flickers
        o.connect(g);g.connect(arpF);o.start(t);o.stop(t+STEP*2);
        if(i===0){
          const b=ac.createOscillator(),bg=ac.createGain();b.type='triangle';b.frequency.value=mhz(root);
          bg.gain.setValueAtTime(0.0001,t);bg.gain.exponentialRampToValueAtTime(0.16,t+0.05);bg.gain.setValueAtTime(0.16,t+STEP*13);bg.gain.exponentialRampToValueAtTime(0.0001,t+STEP*16);
          b.connect(bg);bg.connect(musicG);b.start(t);b.stop(t+STEP*16+0.02);
        }
        if(i%8===0||i%8===3){
          const k=ac.createOscillator(),kg=ac.createGain();k.type='sine';k.frequency.setValueAtTime(70,t);k.frequency.exponentialRampToValueAtTime(38,t+0.14);
          kg.gain.setValueAtTime(i%8===0?0.2:0.11,t);kg.gain.exponentialRampToValueAtTime(0.0001,t+0.16);
          k.connect(kg);kg.connect(musicG);k.start(t);k.stop(t+0.18);
        }
      }catch(e){}
      seqT+=STEP;seqStep++;
    }
  },50);
}
function stopSynth(){if(synthTimer){clearInterval(synthTimer);synthTimer=null;}}
function setMute(m){
  muted=m;if(master)master.gain.value=m?0:1;if(music)music.muted=m;
  try{localStorage.setItem('homebeforedark-muted',m?'1':'0');}catch(e){}
}
function beep(f,d,type,vol,f2){
  if(!ac)return;
  try{const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime;o.type=type;o.frequency.setValueAtTime(f,n);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);g.gain.setValueAtTime(vol,n);g.gain.exponentialRampToValueAtTime(0.0001,n+d);
  o.connect(g);g.connect(sfxG);o.start(n);o.stop(n+d+0.02);}catch(e){}
}
function noise(d,vol,f1,f2,q){
  if(!ac)return;
  try{const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain(),n=ac.currentTime;
  s.buffer=noiseBuf;s.loop=true;f.type='bandpass';f.Q.value=q||1;f.frequency.setValueAtTime(f1,n);f.frequency.exponentialRampToValueAtTime(f2,n+d);
  g.gain.setValueAtTime(vol,n);g.gain.exponentialRampToValueAtTime(0.0001,n+d);
  s.connect(f);f.connect(g);g.connect(sfxG);s.start(n,Math.random()*0.5);s.stop(n+d+0.02);}catch(e){}
}

/* ---------- state ---------- */
let state='title',dist=0,v=1.6,lane=0,riderX=0,mons=[],nextSpawn=0,dodged=0,playT=0,dieT=0,best=0,newBest=false;
let headOn=1,amb=0.06,outZ=99,sideVal=[0.5,0.5],warn=[false,false],flickT=0,pedal=0,lastTick=0,fell=false,killer=null,fallDir=1;
let crashes=0,sessionDodged=false,hintT=0,rideSpawns=0;
let startFt=0,finalFt=0,paused=false,homeT=0,winTime=0,bestTime=0,closest=0,newRecord=false;
const T_GRAB=0.55,T_DARK=0.85,T_TILT=1.1,T_FELL=1.5,T_OUT=2.3,T_HFLICK=4.1,T_HOFF=4.5,T_END=5.0,T_AGAIN=6.1;
try{bestTime=+(localStorage.getItem('homebeforedark-time')||0)||0;closest=+(localStorage.getItem('homebeforedark-closest')||0)||0;}catch(e){}
/* ending timeline (seconds after reaching the house) */
const E_OFF=2.2,E_TIP=2.7,E_WALK=2.9,E_DOOR=4.6,E_IN=5.0,E_SHUT=5.4,E_EYES=5.9,E_LAMPS=6.8,E_PORCH=7.4,E_WIN=8.0,E_DARK=8.8,E_THEEND=9.3,E_TIME=10.2,E_AGAIN=11.0;
let porchLv=1,winLv=1,doorOpen=0;
const riding=()=>state==='play'||state==='dying'||state==='home';
const rodeFt=()=>dist*FT_PER_UNIT-startFt;
function prog(){return riding()?Math.max(0,Math.min(1,rodeFt()/HOME_FT)):0;}
function homeZ(){return riding()?(startFt+HOME_FT)/FT_PER_UNIT-dist:1e9;}
function fmtTime(t){const m=Math.floor(t/60),s=Math.floor(t%60);return m+':'+(s<10?'0':'')+s;}
/* each streetlight is either working or dead; dead ones get more common the closer you are to home */
function lampDead(k,si){
  const p=riding()?Math.max(0,Math.min(1,(k*LAMP_D*FT_PER_UNIT-startFt)/HOME_FT)):0;
  let h=Math.sin(k*12.9898+si*78.233)*43758.5453;h-=Math.floor(h);
  return h<DEAD_MIN+(DEAD_MAX-DEAD_MIN)*p;
}
function lampLevel(k,si){
  if(!lampDead(k,si))return sideVal[si];
  return warn[si]?sideVal[si]*0.3:0;   // a dead light only sputters when something is coming
}

function start(){
  state='play';v=START_SPEED;lane=1;riderX=LANE;mons=[];dodged=0;playT=0;dieT=0;newBest=false;fell=false;killer=null;
  headOn=1;amb=0.1;outZ=99;nextSpawn=dist+5;homeT=0;rideSpawns=0;hintT=0;porchLv=1;winLv=1;doorOpen=0;
}
const ease=()=>{const q=Math.min(1,prog()/0.85);return q*q*(3-2*q);};
function spawnGap(){const e=ease();return 7-3.6*e+Math.random()*(3-1.2*e);}
/* returns a short retry gap when it could not place a creature yet */
function spawn(){
  const p=prog();
  if(HOME_FT-rodeFt()<260)return 0;   // the last stretch to the house is quiet
  for(const b of BREATHERS)if(p>b[0]&&p<b[1])return 0;
  const busy=[0,1].map(si=>mons.some(m=>m.si===si&&m.z>m.ldz));
  const lz=LEAP_Z-LATE_LEAP*ease(),ldz=lz-(LEAP_Z-LAND_Z);   // keep warnings on one side from merging
  rideSpawns++;
  let si=rideSpawns===1?0:rideSpawns===2?1:(Math.random()<0.5?0:1);   // first two: one from each side
  if(busy[si])si=1-si;
  if(busy[si]){rideSpawns--;return 1;}
  if(rideSpawns>3&&Math.random()<FAKE_CHANCE+0.1*p){mons.push({fake:true,z:SPAWN_Z,si,lz,ldz});return 0;}   // false alarm
  /* two lanes: the flicker side is the lane it lands in */
  const a={z:SPAWN_Z,lz,ldz,si,x0:(si?1:-1)*(RW+34),x:0,hop:0,leap:false,tl:null,tl0:si?1:-1,passed:false};a.x=a.x0;
  mons.push(a);
  const s2=1-si;
  /* a pair: one from each side, one after the other, so you dodge the first into the second's lane and have to switch back in time */
  if(rideSpawns>3&&!busy[s2]&&p>PAIR_FROM&&Math.random()<Math.min(PAIR_MAX,(p-PAIR_FROM)*1.2)){
    const gap=v*(PAIR_GAP-0.15*ease())+0.3;   // seconds between the two, turned into road distance
    const b={z:SPAWN_Z+gap,lz,ldz,si:s2,x0:(s2?1:-1)*(RW+34),x:0,hop:0,leap:false,tl:null,tl0:s2?1:-1,passed:false};b.x=b.x0;
    mons.push(b);
  }
  return 0;
}
function pickLane(m){return m.tl0;}
function die(m){
  state='dying';dieT=0;v=0;lastTick=0;killer=m;fallDir=m.si?-1:1;crashes++;
  finalFt=Math.max(1,Math.ceil(HOME_FT-rodeFt()));newBest=false;
  if(!closest||finalFt<closest){closest=finalFt;newBest=true;try{localStorage.setItem('homebeforedark-closest',String(closest));}catch(e){}}
  noise(0.6,0.16,900,3200,3);beep(70,0.7,'sawtooth',0.14,40);
}
function win(){
  state='home';homeT=0;mons=[];warn=[false,false];lane=0;winTime=playT;newRecord=!bestTime||winTime<bestTime;
  if(newRecord){bestTime=winTime;try{localStorage.setItem('homebeforedark-time',String(bestTime));}catch(e){}}
}
function setPaused(p){
  if(state!=='play'||p===paused)return;
  paused=p;
  if(ac){(p?ac.suspend():ac.resume()).catch(()=>{});}
  if(music){if(p)music.pause();else music.play().catch(()=>{});}
}
function quit(){
  if(ac)ac.resume().catch(()=>{});
  if(music&&music.paused)music.play().catch(()=>{});
  paused=false;state='title';mons=[];lane=0;riderX=0;warn=[false,false];headOn=1;amb=0.06;outZ=99;killer=null;
}
function steer(d){
  if(paused)return;
  audio();
  if(state==='title'){startFt=dist*FT_PER_UNIT;start();return;}
  if(state==='dying'){if(dieT>(crashes>1?T_QUICK:T_AGAIN)){startFt=dist*FT_PER_UNIT;start();}return;}
  if(state==='home'){if(homeT>E_AGAIN){startFt=dist*FT_PER_UNIT;start();}return;}
  if(d){const nl=d<0?-1:1;if(nl!==lane){lane=nl;noise(0.09,0.05,500,1200,1.5);}}
}

function update(dt){
  flickT-=dt;
  if(flickT<=0){
    flickT=0.04+Math.random()*0.07;let lit=false,any=false;
    for(let s=0;s<2;s++){
      if(warn[s]){any=true;sideVal[s]=Math.random()<0.45?0.04:(Math.random()<0.5?1:0.65);if(sideVal[s]>0.6)lit=true;}
      else sideVal[s]=0.5;
    }
    if(musicG)musicG.gain.setTargetAtTime(MUSIC_VOLUME*(any?0.8:1),ac.currentTime,0.15);
    if(buzzG)buzzG.gain.setTargetAtTime(any?(lit?0.06:0.004):0,ac.currentTime,0.004);
    if(any&&lit&&Math.random()<0.4)noise(0.03,0.04,3000,5000,2);
  }
  if(ac&&whirG){
    const on=state==='play';
    whirG.gain.setTargetAtTime(on?0.018+v*0.006:0,ac.currentTime,0.08);
    whirF.frequency.setTargetAtTime(250+v*130,ac.currentTime,0.1);
    if(on){clickT-=dt*v;if(clickT<=0){clickT=0.3;beep(1900+Math.random()*300,0.012,'square',0.012);}}
  }
  if(state==='title'){v=1.6;dist+=v*dt;pedal+=v*dt;warn=[false,false];return;}
  if(state==='play'){
    playT+=dt;v=START_SPEED+(MAX_SPEED-START_SPEED)*ease();if(hintT>0)hintT-=dt;
    dist+=v*dt;pedal+=v*dt;amb=0.1-0.065*prog();
    riderX+=(lane*LANE-riderX)*Math.min(1,dt*14);
    if(dist>=nextSpawn){const r=spawn();nextSpawn=dist+(r||spawnGap());}
    warn=[false,false];
    for(const m of mons){
      if(m.fake){m.z-=v*dt;if(m.z>m.ldz)warn[m.si]=true;continue;}
      m.z-=v*dt;
      if(m.z>m.ldz)warn[m.si]=true;
      if(!m.leap&&m.z<=m.lz){m.leap=true;m.tl=pickLane(m);noise(0.35,0.07,700,2600,4);}
      if(m.leap){const p=Math.max(0,Math.min(1,(m.lz-m.z)/(m.lz-m.ldz))),e=p*p*(3-2*p);m.x=m.x0+(m.tl*LANE-m.x0)*e;m.hop=Math.sin(Math.PI*p)*26;
        if(!m.landed&&p>=1){m.landed=true;beep(90,0.1,'square',0.05,50);}}
      if(m.z<1.1&&m.z>0.86&&Math.abs(m.x-riderX)<19){die(m);return;}
      if(!m.passed&&m.z<=0.86){m.passed=true;dodged++;if(!sessionDodged){sessionDodged=true;hintT=3;}}
    }
    mons=mons.filter(m=>m.fake?m.z>m.ldz:m.z>0.55);
    if(homeZ()<=6)win();
    return;
  }
  if(state==='home'){
    homeT+=dt;warn=[false,false];
    const left=homeZ()-1.5;v=left>0.02?Math.min(v,left*1.6):0;   // roll gently to a stop at the house
    dist+=v*dt;pedal+=v*dt;riderX+=(0-riderX)*Math.min(1,dt*4);
    headOn=homeT>E_OFF?0:1;
    if(homeT>E_LAMPS)sideVal=[0,0];
    porchLv=homeT>E_PORCH?0:1;winLv=homeT>E_WIN?0:1;
    doorOpen=homeT>E_DOOR-0.25&&homeT<E_SHUT?1:0;
    amb=homeT>E_DARK?0:0.035;
    return;
  }
  /* dying: it reaches him, blackout, boy gone, bike tips over, lights go out, the end */
  dieT+=dt;
  if(dieT<T_GRAB){
    warn=[true,true];
    if(killer){const k=Math.min(1,dt*12);killer.z+=(0.97-killer.z)*k;killer.x+=(riderX-killer.x)*k;killer.hop=0;}
    return;
  }
  warn=[false,false];
  if(dieT<T_DARK){headOn=0;sideVal=[0,0];amb=0;return;}
  if(mons.length){mons=[];killer=null;}
  amb=0.06;headOn=1;
  if(!fell&&dieT>T_FELL){fell=true;beep(180,0.12,'square',0.08,70);noise(0.18,0.1,900,300,1);}
  if(dieT>T_OUT){
    outZ=16*(1-(dieT-T_OUT)/1.6);
    if(outZ>0&&dieT-lastTick>0.2){lastTick=dieT;beep(120,0.06,'square',0.05,60);}
  }
  if(dieT>T_HFLICK)headOn=Math.random()<0.5?1:0.15;
  if(dieT>T_HOFF){headOn=0;amb=0;}
}

/* ---------- drawing ---------- */
const BAYER=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]].map(r=>r.map(n=>n/16));
function drawRoad(){
  buf.fill(0xff000000);
  if(amb<=0&&headOn<=0&&sideVal[0]<=0&&sideVal[1]<=0){ctx.putImageData(img,0,0);return;}
  const rx=riderX,hzv=homeZ();
  for(let y=HZ+1;y<H;y++){
    const z=K/(y-HZ);if(z>18)continue;
    if(z>hzv+0.4)continue;   // nothing past the house
    const wz=z+dist,k=Math.round(wz/LAMP_D),dz=(wz-k*LAMP_D)/0.55;
    let pool=1-dz*dz;if(k*LAMP_D-dist>outZ||k*LAMP_D-dist>hzv)pool=0;
    const l0=pool>0?lampLevel(k,0):0,l1=pool>0?lampLevel(k,1):0;
    let porch=0;if(hzv<18){const dh=(z-hzv)/1.6;porch=Math.max(0,1-dh*dh)*0.45*porchLv;}
    const dash=(wz%DASH)<DASH*0.5,hz=z-1.02;
    let f=0,spread=1;
    if(hz>0&&hz<5.5){f=Math.min(1,hz/0.3)*(1-hz/5.5)*headOn;spread=12+hz*24;}
    const row=y*W,by=BAYER[y&3];
    for(let x=0;x<W;x++){
      const wx=(x-CX)*z,a=wx<0?-wx:wx;
      if(a>RW+70)continue;
      let L=amb;
      if(f>0){const dx=(wx-rx)/spread,g=1-dx*dx;if(g>0)L+=f*g;}
      if(pool>0){
        let dl=(wx+RW-6)/60,q=pool-dl*dl;if(q>0)L+=l0*q*0.4;
        dl=(wx-RW+6)/60;q=pool-dl*dl;if(q>0)L+=l1*q*0.4;
      }
      if(porch>0){const dp=wx/(RW+50),q=porch*(1-dp*dp);if(q>0)L+=q;}
      if(L<=0)continue;
      let r,g,b;
      if(a<RW){
        if(a<2.2&&dash){r=255;g=210;b=80;L*=1.7;}
        else if(a>RW-4){r=190;g=190;b=190;}
        else{r=74;g=74;b=88;}
      }else if(a<RW+7){r=70;g=58;b=44;}
      else{r=26;g=50;b=30;}
      let q=Math.floor(L*6+by[x&3])/6;if(q<=0)continue;if(q>1)q=1;
      buf[row+x]=0xff000000|(((b*q)|0)<<16)|(((g*q)|0)<<8)|((r*q)|0);
    }
  }
  ctx.putImageData(img,0,0);
}
function drawLamps(){
  if(amb<=0&&state==='dying'&&dieT>T_DARK)return;
  const k0=Math.ceil((dist+0.75)/LAMP_D),k1=Math.floor((dist+12)/LAMP_D);
  for(let k=k1;k>=k0;k--){
    const zl=k*LAMP_D-dist,s=1/zl,by=HZ+K*s;
    if(zl>homeZ())continue;
    for(let si=0;si<2;si++){
      const side=si?1:-1,lv=zl>outZ?0:lampLevel(k,si),bx=CX+side*(RW+12)*s;
      const ph=Math.max(2,Math.round(100*s)),pw=Math.max(1,Math.round(3*s)),top=Math.round(by)-ph;
      ctx.globalAlpha=1;ctx.fillStyle='#1d1d26';
      ctx.fillRect(Math.round(bx-pw/2),top,pw,ph);
      const al=Math.max(1,Math.round(18*s));
      ctx.fillRect(side>0?Math.round(bx)-al:Math.round(bx),top,al,Math.max(1,Math.round(2*s)));
      if(lv>0){
        const lw=Math.max(1,Math.round(7*s)),lh=Math.max(1,Math.round(3*s)),lx=Math.round(bx-side*16*s-lw/2),ly=top+Math.max(1,Math.round(2*s));

        ctx.globalAlpha=Math.min(1,0.3+lv*0.7);ctx.fillRect(lx,ly,lw,lh);

}
/* dusk fades to full night over the ride home */
function drawSky(){

    const a=state==='title'?0.55:0.5+0.5*p;
    const g=3+Math.round(4*p);ctx.fillStyle='#ffc46e';ctx.globalAlpha=a*0.12;ctx.fillRect(CX-g,HZ-1-g,g*2+1,g*2+1);ctx.globalAlpha=a*0.25;ctx.fillRect(CX-1,HZ-2,3,3);ctx.globalAlpha=a;ctx.fillRect(CX,HZ-1,1,1);ctx.globalAlpha=1;return;

/* eyes in the trees once he is inside */
const EYES=[[-RW-40,3.4,0],[RW+52,4.6,0.7],[-RW-34,6.2,1.3]];
function drawEyes(){

  for(const [wx,z,d] of EYES){
    const t=homeT-E_EYES-d;if(t<0)continue;
    if(((t*2.7+d*5)%4)<0.18)continue;   // blink

    ctx.fillRect(Math.round(ex-gap/2-sz/2),Math.round(ey),sz,sz);ctx.fillRect(Math.round(ex+gap/2-sz/2),Math.round(ey),sz,sz);

/* the boy hops off, the bike tips over, he walks in and shuts the door */

/* the woods: a treeline on the horizon and trunks along the road */
const TREE_D=1.9;
let treeTop=new Int8Array(1);
function makeTreeline(){
  treeTop=new Int8Array(W);let sd=11;const r=()=>(sd=(sd*16807)%2147483647)/2147483647;
  for(let cx=-6;cx<W+6;cx+=3+Math.floor(r()*5)){
    const h=4+Math.floor(r()*9);
    for(let i=-h;i<=h;i++){const xx=cx+i;if(xx<0||xx>=W)continue;let hh=h-Math.abs(i)*2;const d=Math.abs(xx-CX);if(d<12)hh=Math.min(hh,d>>2);if(hh>treeTop[xx])treeTop[xx]=hh;}
  }
}
function drawWoods(){
  if(amb<=0)return;
  ctx.fillStyle='#020304';
  for(let x=0;x<W;x++){const h=treeTop[x];if(h>0)ctx.fillRect(x,HZ-h,1,h+1);}
  const hzv=homeZ(),k0=Math.ceil((dist+0.9)/TREE_D),k1=Math.floor((dist+14)/TREE_D);
  for(let k=k1;k>=k0;k--){
    const z=k*TREE_D-dist;if(z>hzv)continue;const s=1/z,by=HZ+K*s;
    for(let si=0;si<2;si++){
      let h=Math.sin(k*91.7+si*13.1)*43758.5;h-=Math.floor(h);if(h<0.3)continue;
      const side=si?1:-1,wx=side*(RW+38+h*60),w=Math.max(1,Math.round((5+h*4)*s)),th=Math.round((150+h*90)*s);
      const kl=Math.round((z+dist)/LAMP_D),near=Math.abs(z+dist-kl*LAMP_D)<1.6?lampLevel(kl,si):0;
      const L=Math.min(1,amb*1.4+near*0.35),c=Math.round(10+60*L);
      ctx.fillStyle='rgb('+c+','+Math.round(c*0.85)+','+Math.round(c*0.7)+')';
      ctx.fillRect(Math.round(CX+wx*s-w/2),Math.round(by-th),w,th);

  }
}
function drawMon(m){

    else{const q=(m.ldz-m.z)/0.5;if(q<1){sy=0.78+0.22*q;sx=1.12-0.12*q;}else if(m.z<2.1){frame=monReach;glow=monReachGlow;}}

function drawRider(){

    if(dieT<T_GRAB){ctx.drawImage(riderA,x,top);return;}
    if(dieT<T_DARK){ctx.globalAlpha=0.25;ctx.drawImage(riderA,x,top);ctx.globalAlpha=1;return;}
    const a=dieT>T_HOFF?0:(dieT>T_HFLICK?0.5:1);if(a<=0)return;
    ctx.globalAlpha=a;
    if(dieT<T_TILT)ctx.drawImage(bikeOnly,x,top);
    else if(dieT<T_FELL){
      const p=(dieT-T_TILT)/(T_FELL-T_TILT),ang=Math.round(p*p*5)/5*1.35*fallDir;   // stepped tilt, like a few animation frames
      ctx.save();ctx.translate(x+10,YR);ctx.rotate(ang);ctx.drawImage(bikeOnly,-10,-RH);ctx.restore();
    }else{
      const bounce=dieT<T_FELL+0.08?-1:0;
      ctx.save();ctx.translate(x+10+fallDir*6,YR+bounce);if(fallDir<0)ctx.scale(-1,1);ctx.drawImage(fallen,-15,-10);ctx.restore();
    }
    ctx.globalAlpha=1;return;
  }
  const fr=(Math.floor(pedal*2.2)&1)?riderA:riderB;
  const lean=Math.max(-2,Math.min(2,Math.round((lane*LANE-riderX)/10)));
  if(lean&&state==='play'){
    ctx.drawImage(fr,0,0,20,10,x+lean,top,20,10);
    ctx.drawImage(fr,0,10,20,9,x+(lean>0?Math.ceil(lean/2):Math.floor(lean/2)),top+10,20,9);
    ctx.drawImage(fr,0,19,20,RH-19,x,top+19,20,RH-19);
  }else ctx.drawImage(fr,x,top);
  ctx.fillStyle='#74748a';const ph=Math.floor(pedal*8);
  for(let n=0;n<3;n++)ctx.fillRect(x+9,top+21+((ph+n*4)%10),2,1);
}
function drawMute(){
  const x=W-15,y=5,ink='#d8d0c0';
  ctx.globalAlpha=0.6;ctx.fillStyle=ink;
  ctx.fillRect(x,y+2,2,3);ctx.fillRect(x+2,y+1,1,5);ctx.fillRect(x+3,y,1,7);
  if(!muted){ctx.fillRect(x+5,y+2,1,3);ctx.fillRect(x+7,y+1,1,5);}
  else{ctx.fillStyle='#cf2a1f';for(let i=0;i<5;i++){ctx.fillRect(x+5+i,y+1+i,1,1);ctx.fillRect(x+9-i,y+1+i,1,1);}}
  ctx.globalAlpha=1;
}
function render(){
  drawRoad();
  drawSky();
  const starA=state==='title'?0.45:0.45+0.55*Math.min(1,prog()/0.65);
  if(amb>0)for(const s of stars){ctx.globalAlpha=s[2]*starA;ctx.fillStyle='#8890a8';ctx.fillRect(s[0],s[1],1,1);}
  ctx.globalAlpha=1;
  drawWoods();
  drawLamps();
  drawHome();
  drawEyes();
  drawPack();
  if(state==='play')for(const m of mons)if(!m.fake&&m.leap&&!m.landed){   // shadow where it will land
    const q=Math.max(0,Math.min(1,(m.lz-m.z)/(m.lz-m.ldz))),zz=m.z,w=Math.max(3,Math.round((16+10*q)*2/zz)),h=Math.max(1,Math.round(w*0.22));
    const x=Math.round(CX+m.tl*LANE/zz-w/2),y=Math.round(HZ+K/zz-h/2);
    ctx.globalAlpha=0.35+0.45*q;ctx.fillStyle='#000';ctx.fillRect(x+1,y,w-2,h);if(h>2)ctx.fillRect(x,y+1,w,h-2);
  }
  ctx.globalAlpha=1;
  const grab=state==='dying'&&dieT<T_GRAB;
  if(grab){ctx.save();ctx.translate(Math.round(Math.random()*2-1),Math.round(Math.random()*2-1));}
  const ms=mons.slice().sort((a,b)=>b.z-a.z);
  for(const m of ms)if(m.z>=1)drawMon(m);
  if(state==='home'&&homeT>E_OFF)drawEnding();else drawRider();
  for(const m of ms)if(m.z<1)drawMon(m);
  if(grab)ctx.restore();

  const ink='#d8d0c0',red='#cf2a1f',blink=Math.floor(performance.now()/500)&1,narrow=W<=200,big=narrow?2:1;
  if(state==='title'){
    const ty=Math.round(HZ*0.22),o=big>1?6:0;
    ctext('HOME BEFORE DARK',ty+2,2,red);
    if(blink)ctext('TAP OR PRESS A KEY',ty+22,big,ink);
    ctext(narrow?'TAP LEFT OR RIGHT':'LEFT / RIGHT OR TAP SIDES',ty+32+o,1,ink,0.75);
    if(bestTime)ctext('BEST TIME '+fmtTime(bestTime),ty+42+o,1,ink,0.7);
    else if(closest)ctext('CLOSEST '+closest+' FT FROM HOME',ty+42+o,1,ink,0.7);
    else ctext('HALF A MILE HOME',ty+42+o,1,ink,0.7);
    if(!narrow)ctext('P PAUSE   M MUTE',H-9,1,ink,0.35);
  }else if(state==='play'){
    text('HOME '+Math.max(0,Math.ceil(HOME_FT-rodeFt()))+' FT',4,4,1,ink,0.8);
    if(playT<2.5&&!paused)ctext('WATCH THE LIGHTS',HZ-14,1,ink,Math.min(1,(2.5-playT)));
    else if(hintT>0&&!paused)ctext('IT COMES FROM THE FLICKERING SIDE',HZ-14,1,ink,Math.min(1,hintT));
  }else if(state==='home'){
    const ey=Math.round(H*0.4),gold='#ffc46e';
    if(homeT>E_THEEND)ctext('THE END',ey,3,red,Math.min(1,(homeT-E_THEEND)/0.8));
    if(homeT>E_TIME){
      ctext('YOU MADE IT HOME',ey+24,1,gold,0.9);
      ctext('TIME '+fmtTime(winTime)+(newRecord?'  NEW BEST':''),ey+34,1,ink,0.75);
      if(!newRecord)ctext('BEST '+fmtTime(bestTime),ey+44,1,ink,0.6);
    }
    if(homeT>E_AGAIN&&blink)ctext('TAP TO RIDE AGAIN',ey+58,big,ink,0.85);
  }else{
    const ey=Math.round(H*0.4),quick=crashes>1,tH=quick?1:T_END,tL=quick?T_QUICK:T_AGAIN;
    if(dieT>tH)ctext(finalFt+' FT FROM HOME',ey,2,red,Math.min(1,(dieT-tH)/0.6));
    if(dieT>tL){
      ctext(newBest?'CLOSEST YET':(bestTime?'BEST TIME '+fmtTime(bestTime):'CLOSEST '+closest+' FT'),ey+22,1,ink,0.7);
      if(blink)ctext('TAP TO RIDE AGAIN',ey+36,big,ink,0.85);
    }
  }
  if(state==='play'){ctx.globalAlpha=0.6;ctx.fillStyle=ink;ctx.fillRect(W-33,5,2,7);ctx.fillRect(W-29,5,2,7);ctx.globalAlpha=1;}
  if(paused){
    ctx.globalAlpha=0.65;ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;
    const py=Math.round(H*0.3);
    ctext('PAUSED',py,2,red);
    ctext('RESUME',py+28,1,ink,blink?1:0.75);
    ctext('QUIT',py+46,1,ink,0.75);
  }
  drawMute();
}

/* ---------- input + loop ---------- */
addEventListener('keydown',e=>{
  const k=e.key;
  if(k==='ArrowLeft'||k==='a'||k==='A'){e.preventDefault();if(!e.repeat)steer(-1);}
  else if(k==='ArrowRight'||k==='d'||k==='D'){e.preventDefault();if(!e.repeat)steer(1);}
  else if(k===' '||k==='Enter'){e.preventDefault();if(e.repeat)return;if(paused)setPaused(false);else steer(0);}
  else if(k==='m'||k==='M'){setMute(!muted);}
  else if(k==='p'||k==='P'||k==='Escape'){e.preventDefault();if(state==='play')setPaused(!paused);}
  else if((k==='q'||k==='Q')&&paused){quit();}
});
let pDown=null;
stage.addEventListener('pointerdown',e=>{
  e.preventDefault();cv.focus();
  const r=cv.getBoundingClientRect(),gx=(e.clientX-r.left)/r.width*W,gy=(e.clientY-r.top)/r.height*H;
  if(gx>W-21&&gx<=W&&gy>=0&&gy<22){audio();setMute(!muted);pDown=null;return;}
  if(state==='play'&&!paused&&gx>W-44&&gx<=W-21&&gy>=0&&gy<22){setPaused(true);pDown=null;return;}
  if(paused){
    const py=Math.round(H*0.3);
    if(Math.abs(gx-CX)<44&&gy>=py+22&&gy<py+39)setPaused(false);
    else if(Math.abs(gx-CX)<44&&gy>=py+39&&gy<py+58)quit();
    pDown=null;return;
  }
  pDown=null;steer(gx<W/2?-1:1);   // steer the moment a finger touches a side
});
addEventListener('pointercancel',()=>{pDown=null;});
document.addEventListener('visibilitychange',()=>{if(document.hidden)setPaused(true);});
addEventListener('resize',resize);
resize();
try{
  const ic=document.createElement('canvas');ic.width=ic.height=32;const ix=ic.getContext('2d');ix.imageSmoothingEnabled=false;
  ix.fillStyle='#000';ix.fillRect(0,0,32,32);ix.drawImage(riderA,0,0,20,20,0,0,32,32);
  const l=document.createElement('link');l.rel='icon';l.href=ic.toDataURL();document.head.appendChild(l);
}catch(e){}
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(!paused)update(dt);render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
/* test hooks for automated playtests (see _docs/findings): read state, skip ahead (warp), clear creatures, or jump to a set distance from home (remain) */
window.__nr={get state(){return state;},get dieT(){return dieT;},get mons(){return mons;},get lane(){return lane;},get paused(){return paused;},warp(ft){startFt-=ft;},clear(){mons=[];},remain(ft){startFt=dist*FT_PER_UNIT+ft-HOME_FT;mons=[];}};
})();
</script>
